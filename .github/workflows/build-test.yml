name: build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with: 
        submodules: recursive
    - name: set up packages
      run: |
          sudo apt-get update
          sudo apt-get install build-essential git make pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
    - name: build release
      run: |
        cmake . -B build
        cmake --build build
    - name: upload build
      uses: actions/upload-artifact@v4
      with:
        name: sleepdart-linux
        path: build/sleepdart
    - name: run tests
      run: |
        ctest --test-dir build --parallel --output-on-failure

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: git mingw-w64-x86_64-cmake mingw-w64-x86_64-pkgconf mingw-w64-x86_64-binutils mingw-w64-x86_64-gcc
    - run: git config --global core.autocrlf input
      shell: bash
    - uses: actions/checkout@v3
      with: 
        submodules: recursive
    - name: build release
      run: |
        cmake . -B build
        cmake --build build
    - name: upload build
      uses: actions/upload-artifact@v4
      with:
        name: sleepdart-windows
        path: build/sleepdart.exe
    - name: run tests
      run: |
        ctest --test-dir build --parallel --output-on-failure
